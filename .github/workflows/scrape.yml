name: Scrape Daily Houses

on:
  # Manual trigger from the GitHub UI or via API (used by the game's "Scrape" button)
  workflow_dispatch:

  # Optional: also run automatically at 06:00 CET (05:00 UTC)
  schedule:
    - cron: "0 5 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to commit data/houses.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyfunda

      - name: Run scraper
        run: python scraper.py

      - name: Commit & push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/houses.json
          # Only commit if something actually changed
          git diff --cached --quiet || git commit -m "chore: daily house data $(date +%Y-%m-%d)"
          git push
